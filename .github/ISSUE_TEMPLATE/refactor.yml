name: "♻️ Refactor"
description: "코드 구조 개선, 중복 제거, 가독성 향상 등의 리팩토링을 위한 템플릿입니다."
title: "[Refactor]: "
labels: ["refactor"]
body:
  - type: textarea
    id: refactor-target
    attributes:
      label: "♻️ 리팩토링 대상"
      description: "어떤 코드를 개선하는지 작성해주세요."
      placeholder: "예: threads/thread.c 내의 동기화 및 락 반납 로직"
    validations:
      required: true

  - type: checkboxes
    id: project
    attributes:
      label: "📍 Project"
      options:
        - label: "Project 1 - Threads"
        - label: "Project 2 - User Programs"
        - label: "Project 3 - Virtual Memory"
        - label: "Project 4 - File System"

  - type: input
    id: branch
    attributes:
      label: "🌿 작업 Branch"
      placeholder: "예: refactor/#20-sync-clean"

  - type: textarea
    id: before-code
    attributes:
      label: "🌱 Before"
      description: "현재 코드의 문제점을 작성해주세요."
      placeholder: "예: 중복되는 인터럽트 제어 코드가 여러 함수에 산재해 있어 가독성이 떨어짐"
    validations:
      required: true

  - type: textarea
    id: after-code
    attributes:
      label: "🌼 After"
      description: "변경 후 어떤 구조를 목표로 하는지 작성해주세요."
      placeholder: "예: 래퍼 함수를 도입하여 동기화 로직 단일화"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업할 내용"
      description: "리팩토링 세부 진행 항목을 체크리스트로 작성해주세요."
      placeholder: "- [ ] 래퍼 함수 선언 및 구현\n- [ ] 기존 중복 코드 대체\n- [ ] 기존 테스트 통과 여부 확인"
    validations:
      required: true

  - type: textarea
    id: warnings
    attributes:
      label: "⚠️ 주의사항"
      description: "기존 기능에 영향을 줄 수 있는 부분을 작성해주세요."
      placeholder: "예: 인터럽트 상태 변경 순서가 바뀌면 컨텍스트 스위칭 시 교착 상태(Deadlock)가 발생할 수 있음"

  - type: textarea
    id: additional-notes
    attributes:
      label: "🙋 기타"
      description: "논의할 내용이 있다면 작성해주세요."